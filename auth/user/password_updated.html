<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Reset Password — <strong style="color: #144f54;">OM</strong><strong style="color: #128893;">NIS</strong></title>
  <!-- Google Fonts: Manrope -->
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap"
    rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
          },
          colors: {
            brand: {
              teal: '#1B6B72',
              hover: '#144F54',
              tint: '#E4EFEF',
              dark: '#0F172A',
            },
            surface: {
              canvas: '#F7F9FC',
              card: '#FFFFFF',
              subtle: '#F1F5F9',
              dim: '#E2E8F0',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      background-color: #F8FAFC;
    }

    .input-focus-ring:focus-within {
      border-color: #1B6B72;
      box-shadow: 0 0 0 3px rgba(27, 107, 114, 0.15);
    }
  </style>
</head>

<body
  class="min-h-screen flex flex-col justify-between text-slate-800 antialiased selection:bg-teal-100 selection:text-teal-900">
  <!-- Top App Navigation / Minimal Header -->
  <header class="w-full pt-8 pb-4 flex flex-col items-center justify-center">
    <div class="flex items-center gap-3">
      <!-- Embedded SVG Logo matching brand identity -->
      <img alt="NGO ERP" class="h-14 w-auto" src="../../assets/images/logo/Logo_Mode_Professionnel_Elégant_Simple-removebg-preview(1)(1).png" />
    </div>
  </header>
  <!-- Main Content Container -->
  <main class="flex-1 flex items-center justify-center px-4 py-8">
    <div
      class="w-full max-w-[440px] bg-white rounded-2xl shadow-[0_10px_35px_-4px_rgba(15,23,42,0.06),0_2px_8px_-1px_rgba(15,23,42,0.04)] border border-slate-100 p-8 sm:p-10 transition-all">
      <!-- Card Brand Mark & Icon Header -->
      <div class="flex flex-col items-center text-center mb-7">
        <div
          class="w-12 h-12 rounded-xl bg-emerald-50 border border-emerald-100/80 flex items-center justify-center text-emerald-600 mb-5 shadow-sm">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24">
            <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Password updated</h1>
        <p class="text-sm text-slate-500 mt-2 leading-relaxed">Your password has been successfully reset. You can now
          sign in with your new credentials.</p>
      </div>
      <!-- Password Reset Form -->
      <div class="pt-2">
        <a class="w-full py-2.5 px-4 rounded-lg bg-[#1B6B72] hover:bg-[#144F54] active:bg-[#0f3c40] text-white text-sm font-semibold tracking-wide shadow-sm transition-colors flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-[#1B6B72] focus:ring-offset-2"
          href="signin.html" id="sign-in-cta">
          <span>Continue to sign in</span>
          <svg class="w-4 h-4 text-teal-100" fill="none" stroke="currentColor" viewbox="0 0 24 24">
            <path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
        </a>
      </div>
      <!-- Security / Account Notice -->
      <div
        class="mt-6 p-3.5 bg-slate-50 border border-slate-100 rounded-lg flex items-start gap-2.5 text-xs text-slate-600">
        <svg class="w-4 h-4 text-slate-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
          <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round"
            stroke-linejoin="round" stroke-width="2"></path>
        </svg>
        <span class="leading-relaxed">All other active sessions have been signed out for your security.</span>
      </div>
    </div>
  </main>
  <!-- Persistent Minimal Footer -->
  <footer class="w-full py-space-xl px-margin-mobile md:px-margin">
   <div class="w-full text-center mt-space-lg">
          <p class="font-caption text-caption text-text-muted">
            © 2025 <strong style="color: #144f54;">OM</strong><strong style="color: #128893;">NIS</strong>. All rights reserved. •
            <a class="hover:text-text-secondary transition-colors" data-path="privacy-policy" href="#">Privacy</a> •
            <a class="hover:text-text-secondary transition-colors" data-path="terms-of-service" href="#">Terms</a> •
            <a class="hover:text-text-secondary transition-colors" data-path="security-overview" href="#">Security</a>
          </p>
        </div>
  </footer>
  <!-- Interactive script for password visibility toggle -->
  <script>
    function setupPasswordToggle(buttonId, inputId) {
      const btn = document.getElementById(buttonId);
      const input = document.getElementById(inputId);
      if (!btn || !input) return;

      btn.addEventListener('click', () => {
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        btn.classList.toggle('text-teal-700', isPassword);
      });
    }

    setupPasswordToggle('toggle-new-pwd', 'new-password');
    setupPasswordToggle('toggle-confirm-pwd', 'confirm-password');
  </script>
</body>

</html>
