<body
  class="min-h-screen bg-surface-canvas text-on-surface font-body-md text-body-md antialiased flex flex-col justify-between selection:bg-primary-tint selection:text-primary">
  <header class="w-full pt-space-2xl pb-space-lg flex justify-center items-center">
    <a
      class="inline-flex items-center gap-space-sm focus:outline-none focus:ring-2 focus:ring-border-focus rounded-lg"
      data-path="login" href="../../index.html">
      <img alt="NGO ERP Logo" class="h-12 w-auto object-contain" src="../../assets/images/logo/Logo_Mode_Professionnel_Elégant_Simple-removebg-preview(1)(1).png"/>
    </a>
  </header>
  <main class="w-full flex-1 flex flex-col items-center justify-center px-margin-mobile md:px-margin py-space-md">
    <div class="w-full max-w-[500px] mx-auto">
      <div class="flex flex-col w-full">
        <div class="w-full bg-surface-card rounded-lg shadow-sm p-space-xl flex flex-col items-center">
          <!-- Logo -->
          <!-- Title & Subtitle -->
          <div class="w-full text-center mb-space-xl">
            <h1 class="font-headline-md text-headline-md text-on-surface font-bold tracking-tight">
              Sign in
            </h1>
            <p class="font-body-sm text-body-sm text-text-secondary mt-space-xs">
              Enter your credentials to access your account.
            </p>
          </div>
          <!-- Authentication Form -->
          <form class="w-full flex flex-col gap-space-md" id="loginForm" onsubmit="handleLogin(event)">
            <!-- Work Email Field -->
            <div class="flex flex-col gap-space-xs text-left">
              <label class="font-title-sm text-title-sm text-on-surface font-semibold" for="work-email">
                Work email
              </label>
              <div class="relative flex items-center">
                <span
                  class="material-symbols-outlined absolute left-3 text-text-muted select-none pointer-events-none text-[18px]">
                  mail
                </span>
                <input
                  class="w-full h-10 pl-9 pr-3 text-on-surface bg-surface-card rounded-lg font-body-md text-body-md transition-shadow duration-150 ease-in-out shadow-sm placeholder:text-text-muted focus:shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-container"
                  id="work-email" name="email" placeholder="name@organization.org" required="" type="email" />
              </div>
            </div>
            <!-- Password Field -->
            <div class="flex flex-col gap-space-xs text-left">
              <label class="font-title-sm text-title-sm text-on-surface font-semibold" for="account-password">
                Password
              </label>
              <div class="relative flex items-center">
                <input
                  class="w-full h-10 pl-3 pr-10 text-on-surface bg-surface-card rounded-lg font-body-md text-body-md transition-shadow duration-150 ease-in-out shadow-sm placeholder:text-text-muted focus:shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-container"
                  id="account-password" name="password" placeholder="Enter your password" required="" type="password" />
                <button aria-label="Toggle password visibility"
                  class="absolute right-2.5 p-1 text-text-muted hover:text-on-surface flex items-center justify-center focus:outline-none focus:ring-1 focus:ring-primary-container rounded"
                  id="togglePassword" onclick="togglePasswordVisibility()" type="button">
                  <span class="material-symbols-outlined text-[20px]" id="eyeIcon">
                    visibility
                  </span>
                </button>
              </div>
            </div>
            <!-- Remember & Forgot Password Row -->
            <div class="flex items-center justify-between mt-space-xs">
              <label class="inline-flex items-center gap-2 cursor-pointer select-none">
                <input
                  class="w-4 h-4 rounded text-primary-container focus:ring-primary-container focus:ring-offset-0 bg-surface-card shadow-sm cursor-pointer accent-primary-container"
                  id="remember-device" name="remember" type="checkbox" />
                <span class="font-body-sm text-body-sm text-text-secondary">
                  Remember this device
                </span>
              </label>
              <a class="font-title-sm text-title-sm text-primary-container hover:text-primary-hover font-semibold transition-colors focus:outline-none focus:underline"
                data-path="forgot-password" href="forgot_password.html">
                Forgot password?
              </a>
            </div>
            <!-- Submit CTA Button -->
            <div class="mt-space-sm">
              <button
                class="w-full h-10 bg-primary-container hover:bg-primary-hover active:bg-primary text-on-primary font-title-sm text-title-sm font-semibold rounded-lg shadow-sm flex items-center justify-center transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container"
                id="submitButton" type="submit">
                <span id="btnText">Sign in</span>
                <svg class="hidden animate-spin ml-2 h-4 w-4 text-on-primary" fill="none" id="btnSpinner"
                  viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" fill="currentColor"></path>
                </svg>
              </button>
            </div>
          </form>
          <!-- Divider & Institutional Sign-up Prompt -->
          <div class="w-full pt-space-lg mt-space-md text-center bg-surface-subtle/50 rounded-lg py-space-sm">
            <p class="font-body-sm text-body-sm text-text-secondary">
              Don't have an account?
              <a class="text-primary-container hover:text-primary-hover font-semibold transition-colors ml-1 focus:outline-none focus:underline"
                data-path="signup" href="../../signup.html">
                Sign up
              </a>
            </p>
          </div>
        </div>
        <!-- Minimal Institutional Micro-Footer -->
      </div>
      <script>
        function togglePasswordVisibility() {
          const passwordInput = document.getElementById('account-password');
          const eyeIcon = document.getElementById('eyeIcon');
          if (!passwordInput || !eyeIcon) return;

          if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.textContent = 'visibility_off';
          } else {
            passwordInput.type = 'password';
            eyeIcon.textContent = 'visibility';
          }
        }
        

        function handleLogin(event) {
          event.preventDefault();
          const btnText = document.getElementById('btnText');
          const btnSpinner = document.getElementById('btnSpinner');
          const submitButton = document.getElementById('submitButton');

          if (btnText && btnSpinner && submitButton) {
  // 1. Enter loading state
  btnText.textContent = 'Signing in...';
  btnSpinner.classList.remove('hidden');
  submitButton.disabled = true;
  submitButton.classList.add('opacity-90', 'cursor-not-allowed');

  // 2. Simulate delay then navigate
  setTimeout(() => {
    window.location.href = '../../org/omnis_overview_dashboard.html';
  }, 1500);
}
        }
      </script>
    </div>
  </main>
  <footer class="w-full py-space-xl px-margin-mobile md:px-margin">
   <div class="w-full text-center mt-space-lg">
          <p class="font-caption text-caption text-text-muted">
            © 2025 <strong style="color: #144f54;">OM</strong><strong style="color: #128893;">NIS</strong>. All rights reserved. •
            <a class="hover:text-text-secondary transition-colors" data-path="privacy-policy" href="#">Privacy</a> •
            <a class="hover:text-text-secondary transition-colors" data-path="terms-of-service" href="#">Terms</a> •
            <a class="hover:text-text-secondary transition-colors" data-path="security-overview" href="#">Security</a>
          </p>
        </div>
  </footer>
